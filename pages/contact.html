<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Laymanbekery</title>
    <meta name="description" content="ติดต่อ Laymanbekery เพื่อสั่งขนมปังล่วงหน้า สอบถามราคา หรือสั่ง snack box" />
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
    <link rel="canonical" href="https://newkyj.github.io/laymansbekeery/pages/contact.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <main class="section inner-page">
      <div class="section-heading centered">
        <p class="eyebrow">Contact & Order</p>
        <h2>สั่งขนมปังล่วงหน้ากับ Laymanbekery ได้ง่าย ๆ</h2>
        <p>เหมาะสำหรับ pre-order รายวัน ของฝาก snack box หรือสอบถามออเดอร์พิเศษ</p>
      </div>

      <div class="contact-layout">
        <div class="contact-panel">
          <h3>Contact Info</h3>
          <p>Line: @laymanbekery</p>
          <p>Tel: 08x-xxx-xxxx</p>
          <p>Email: hello@laymanbekery.local</p>
          <p>Open daily 07:00 - 18:00</p>
          <div class="contact-cart-preview" data-contact-cart-preview>
            <strong>Cart summary</strong>
            <p data-contact-cart-empty>ยังไม่มีรายการจากหน้าเมนู</p>
            <div class="contact-cart-list" data-contact-cart-list></div>
          </div>
        </div>

        <form class="order-form" data-order-form>
          <label>
            ชื่อ
            <input type="text" name="name" placeholder="Your name" />
          </label>
          <label>
            เบอร์โทร / Line
            <input type="text" name="contact" placeholder="Phone or Line ID" />
          </label>
          <label>
            รายการที่ต้องการ
            <input type="text" name="items" placeholder="เช่น Strawberry Milk Bun 6 ชิ้น" data-order-items />
          </label>
          <label>
            รายละเอียดเพิ่มเติม
            <textarea name="message" rows="5" placeholder="ระบุวันรับสินค้า จำนวน และหมายเหตุ" data-order-message></textarea>
          </label>
          <button class="btn btn-primary" type="submit">ส่งคำสั่งซื้อ</button>
        </form>
      </div>

      <div class="hero-actions" style="justify-content:center; margin-top: 32px;">
        <a class="btn btn-secondary" href="../index.html">กลับหน้าแรก</a>
      </div>
    </main>
    <button class="btn btn-secondary theme-toggle" type="button" data-theme-toggle>🌙 Dark mode</button>
    <script src="../assets/js/script.js"></script>
  </body>
</html>
